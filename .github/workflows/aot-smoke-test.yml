name: Native AOT Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  aot-smoke-test:
    name: Native AOT Compilation Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT Smoke Test Executable
        run: dotnet publish samples/EricksonLopez.Webhooks.Sample/EricksonLopez.Webhooks.Sample.csproj -c Release -r linux-x64 -p:PublishAot=true
