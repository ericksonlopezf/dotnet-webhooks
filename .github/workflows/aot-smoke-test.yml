name: Native AOT Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  aot-smoke-test:
    name: Native AOT Compilation Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT Smoke Test Executable
        run: dotnet publish samples/EricksonLopez.Webhooks.Sample/EricksonLopez.Webhooks.Sample.csproj -c Release -r linux-x64 -p:PublishAot=true
