name: Main Continuous Integration & Quality Gates

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Full Build & Multi-TFM Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore Dependencies
        run: dotnet restore EricksonLopez.Webhooks.slnx

      - name: Validate Documentation Links
        shell: pwsh
        run: ./scripts/validate-links.ps1

      - name: Validate Repository Compliance & Standards
        shell: pwsh
        run: ./scripts/validate-compliance.ps1

      - name: Compile Solution (Release Mode)
        run: dotnet build EricksonLopez.Webhooks.slnx -c Release --no-restore

      - name: Run Tests with Code Coverage (Coverlet)
        run: >
          dotnet test EricksonLopez.Webhooks.slnx -c Release --no-build
          --settings coverlet.runsettings
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: code-coverage-reports
          path: ./TestResults/**/coverage.cobertura.xml

      - name: Build NuGet Packages
        run: dotnet pack EricksonLopez.Webhooks.slnx -c Release --no-build -o ./artifacts

      - name: Upload Package Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
